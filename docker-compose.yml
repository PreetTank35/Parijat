version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: parijat-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: parijat
      POSTGRES_PASSWORD: parijat123
      POSTGRES_DB: parijat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parijat']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
